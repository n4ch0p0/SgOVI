<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OVI Castelló — Plataforma de gestió d'Assistència Personal per a la Vida Independent">
  <title th:text="${title}">OVI Castelló</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../css/ovi.css"
        href="../css/ovi.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script></head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-people-fill me-2"></i>OVI Castelló
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Obrir menú de navegació">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <!-- Logininfo fragment: mostra el nom de l'usuari autenticat -->
                <li class="nav-item d-flex align-items-center">
                    <div th:replace="~{fragments/logininfo :: logininfo}">...</div>
                </li>

                <li class="nav-item" th:if="${session.usuarioLogueado == null and session.asistenteLogueado == null and session.tecnicLogueado == null}">
                    <a class="btn btn-outline-light ms-2" th:href="@{/registro/seleccion}">Registrar-se</a>
                </li>

                <li class="nav-item" th:if="${session.usuarioLogueado != null or session.asistenteLogueado != null or session.tecnicLogueado != null}">
                    <a class="btn btn-danger ms-2" th:href="@{/logout}">Tancar Sessió</a>
                </li>

            </ul>
        </div>
    </div>
</nav>
<main class="container mt-5">
    <div class="ovi-login-card">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title">
                    <i class="bi bi-shield-lock-fill"></i>
                    Iniciar Sessió
                </h3>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">DNI</label>
                        <input type="text" id="username" class="form-control" name="username" placeholder="12345678A" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contrasenya</label>
                        <input type="password" id="password" class="form-control" name="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" style="padding: .7rem;">Entrar</button>
                </form>
                <div class="text-center mt-3">
                    <a th:href="@{/registro/seleccion}" class="text-muted" style="font-size: .85rem;">No tens compte? Registra't ací</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
