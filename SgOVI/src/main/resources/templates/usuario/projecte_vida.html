<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('El meu Projecte de Vida - OVI')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<main class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                    <h3 class="mb-0"><i class="bi bi-journal-heart me-1"></i>El meu Projecte de Vida</h3>
                    <a th:href="@{/usuario/dashboard}" class="btn btn-dark btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>
                </div>
                <div class="card-body">
                    <p class="text-muted">Comparteix la teua història, els teus plans de futur, passatemps i tot allò que et defineix. Aquesta informació ajudarà els assistents a conéixer-te millor.</p>
                    <form th:action="@{/usuario/projecte-vida/guardar}" method="post">
                        <div class="mb-3">
                            <label for="projecteVida" class="form-label fw-bold">La teua història i projecte</label>
                            <textarea id="projecteVida" name="projecteVida" class="form-control" rows="12"
                                      placeholder="Explica la teua vida, els teus somnis, hobbies, aficions, com t'agrada passar el temps..."
                                      th:text="${usuario.projecteVida}"></textarea>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-warning px-5">
                                <i class="bi bi-save me-1"></i>Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100" th:if="${mensajeExito}">
    <div id="toastProjecte" class="toast align-items-center text-bg-success border-0"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensajeExito}"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Tancar"></button>
        </div>
    </div>
</div>
<th:block th:if="${mensajeExito}">
<script>new bootstrap.Toast(document.getElementById('toastProjecte'), { delay: 5000 }).show();</script>
</th:block>
</body>
</html>
