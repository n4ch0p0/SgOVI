<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Modificar Contracte - OVI')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Modificar Dates del Contracte #<span th:text="${contracte.id}"></span></h4>
                </div>
                <div class="card-body">
                    <form id="formEditarContracte" th:action="@{/usuario/contractes/update}" method="post">
                        <input type="hidden" name="id" th:value="${contracte.id}" />

                        <div class="mb-3">
                            <label class="form-label">Assistent Assignat (DNI)</label>
                            <input type="text" class="form-control bg-light" th:value="${contracte.dniAsistente}" readonly />
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nova Data Inici</label>
                                <input type="date" name="dataInici" class="form-control" th:value="${contracte.dataInici}" required />
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nova Data Fi (Opcional)</label>
                                <input type="date" name="dataFi" class="form-control" th:value="${contracte.dataFi}" />
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-3">
                            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalConfirmarContracteUpdate">Guardar Canvis</button>
                            <a th:href="@{/usuario/contractes}" class="btn btn-outline-secondary">Cancel·lar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal de confirmació de modificació de contracte -->
<div class="modal fade" id="modalConfirmarContracteUpdate" tabindex="-1" aria-labelledby="modalConfirmarContracteUpdateLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-primary">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalConfirmarContracteUpdateLabel">
                    <i class="bi bi-question-circle-fill me-1"></i>Confirmar Modificació
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Tancar"></button>
            </div>
            <div class="modal-body">
                <p>Estàs segur/a que vols <strong class="text-primary">modificar les dates</strong> d'aquest contracte?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-arrow-left me-1"></i>Cancel·lar
                </button>
                <button type="button" class="btn btn-primary" onclick="document.getElementById('formEditarContracte').submit();">
                    <i class="bi bi-save me-1"></i>Sí, Guardar Canvis
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
