<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Nova Sol·licitud - OVI')}"></head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Demanar Nova Assistència</h4>
                </div>
                <div class="card-body">
                    <form id="formSolicitud" th:action="@{/usuario/solicitudes/add}" th:object="${apRequest}" method="post">
                        <div class="mb-3">
                            <label for="dniUsuario" class="form-label">El teu DNI</label>
                            <input type="text" id="dniUsuario" class="form-control bg-light"
                                   th:field="*{dniUsuario}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="tipusServei" class="form-label">Tipus de Servei Necessari <span class="text-danger">*</span></label>
                            <select id="tipusServei" class="form-select"
                                    th:field="*{tipusServei}"
                                    th:classappend="${#fields.hasErrors('tipusServei')} ? 'is-invalid'">
                                <option value="PAP">Professional d'Assistència Personal (PAP)</option>
                                <option value="PATY">Professional d'Assistència Terapèutica Infantil (PATI)</option>
                            </select>
                            <div th:if="${#fields.hasErrors('tipusServei')}" th:errors="*{tipusServei}"
                                 class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="preferencies" class="form-label">Preferències / Necessitats específiques <span class="text-danger">*</span></label>
                            <textarea id="preferencies" class="form-control"
                                      th:field="*{preferencies}" rows="3"
                                      th:classappend="${#fields.hasErrors('preferencies')} ? 'is-invalid'"
                                      placeholder="Horaris, tipus de suport, zona geogràfica..."></textarea>
                            <div th:if="${#fields.hasErrors('preferencies')}" th:errors="*{preferencies}"
                                 class="invalid-feedback"></div>
                            <div class="form-text">Mínim 5 caràcters. Descriu horaris, necessitats, zona preferida, etc.</div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/usuario/dashboard}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Cancel·lar
                            </a>
                            <button type="button" class="btn btn-success px-5" data-bs-toggle="modal" data-bs-target="#modalConfirmarSolicitud">
                                <i class="bi bi-send me-1"></i>Enviar Sol·licitud
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal de confirmació de sol·licitud -->
<div class="modal fade" id="modalConfirmarSolicitud" tabindex="-1" aria-labelledby="modalConfirmarSolicitudLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-success">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalConfirmarSolicitudLabel">
                    <i class="bi bi-question-circle-fill me-1"></i>Confirmar Sol·licitud
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Tancar"></button>
            </div>
            <div class="modal-body">
                <p>Estàs segur/a que vols <strong class="text-success">enviar aquesta sol·licitud d'assistència</strong>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="bi bi-arrow-left me-1"></i>Cancel·lar
                </button>
                <button type="button" class="btn btn-success" onclick="document.getElementById('formSolicitud').submit();">
                    <i class="bi bi-send me-1"></i>Sí, Enviar
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
