<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Les meues Sol·licituds - OVI')}"></head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<!-- Toast confirmació nova sol·licitud -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100" th:if="${mensajeEnvio}">
    <div id="toastSolicitud" class="toast align-items-center text-bg-success border-0"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensajeEnvio}"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Tancar"></button>
        </div>
    </div>
</div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 style="margin-bottom: .25rem;">Les meues Sol·licituds</h2>
            <p class="text-muted mb-0" style="font-size: .875rem;">Gestiona les teues peticions d'assistència personal.</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/usuario/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>
            <a th:href="@{/usuario/solicitudes/nueva}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Nova Sol·licitud</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Preferències</th>
                    <th>Estat</th>
                    <th>Accions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="req : ${solicitudes}">
                    <td th:text="${req.preferencies}"></td>
                    <td>
                        <span th:if="${req.estat == 'Aprovada'}" class="badge bg-success">Aprovada</span>
                        <span th:if="${req.estat == 'Revisio'}" class="badge bg-warning">En Revisió</span>
                        <span th:if="${req.estat == 'Rebutjada'}" class="badge bg-danger">Rebutjada</span>
                        <span th:if="${req.estat == 'Tancada_Contracte'}" class="badge bg-info">Tancada</span>
                        <span th:if="${req.estat == 'Finalitzada'}" class="badge bg-secondary" style="background: var(--ovi-gray-200) !important; color: var(--ovi-gray-600) !important;">Finalitzada</span>
                    </td>
                    <td>
                        <a th:if="${req.estat == 'Aprovada'}" th:href="@{/usuario/solicitudes/{id}/candidatos(id=${req.id})}" class="btn btn-sm btn-primary">
                            <i class="bi bi-search me-1"></i>Buscar Assistents
                        </a>
                        <span th:if="${req.estat != 'Aprovada'}" class="text-muted small">Pendent de Tècnic</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(solicitudes)}">
                    <td colspan="3" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox" style="font-size: 2rem; display: block; margin-bottom: .5rem; opacity: .5;"></i>
                        Encara no tens cap sol·licitud.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<th:block th:if="${mensajeEnvio}">
<script>
    new bootstrap.Toast(document.getElementById('toastSolicitud'), { delay: 5000 }).show();
</script>
</th:block>
</body>
</html>
