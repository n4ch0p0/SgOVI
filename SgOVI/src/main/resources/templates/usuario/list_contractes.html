<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Els meus Contractes - OVI')}"></head>

<body>
  <nav th:replace="~{fragments/nav :: navbar}"></nav>
  <main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 style="margin-bottom: .25rem;">Els meus Contractes Actius</h2>
            <p class="text-muted mb-0" style="font-size: .875rem;">Consulta i gestiona els teus acords d'assistència personal.</p>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Assistent assignat</th>
                    <th>Data Inici</th>
                    <th>Data Fi</th>
                    <th>Document</th>
                    <th>Estat</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${registreContracteUsuarioOvis}">
                    <td th:text="${mapaNomsAssistents[c.dniAsistente]}" class="fw-bold"></td>
                    <td th:text="${#temporals.format(c.dataInici, 'dd/MM/yyyy')}"></td>
                    <td th:text="${c.dataFi != null ? #temporals.format(c.dataFi, 'dd/MM/yyyy') : 'Indefinit'}"></td>
                    <td>
                        <a th:href="@{/usuario/contractes/editar/{id}(id=${c.id})}" class="btn btn-sm btn-warning text-white">
                            <i class="bi bi-pencil me-1"></i> Editar
                        </a>
                    </td>
                    <td><span class="badge bg-success">Formalitzat</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(registreContracteUsuarioOvis)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-file-earmark-x" style="font-size: 2rem; display: block; margin-bottom: .5rem; opacity: .5;"></i>
                        No tens contractes registrats.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <a th:href="@{/usuario/dashboard}" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left me-1"></i> Tornar al Tauler</a>
  </main>
</body>

</html>
