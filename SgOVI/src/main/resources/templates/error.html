<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error - OVI')}"></head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<main class="container mt-5">
    <div class="ovi-status-page rejected">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <h2 style="font-weight: 800; letter-spacing: -0.03em;" th:text="${errorName} ?: 'S''ha produït un error'"></h2>
        <p class="text-muted mt-3" th:text="${message} ?: 'Hem detectat un problema al servidor. Per favor, torna a intentar-ho.'"></p>
        <a href="/" class="btn btn-primary mt-4 px-4 py-2">Tornar a l'Inici</a>
    </div>
</main>
</body>
</html>
