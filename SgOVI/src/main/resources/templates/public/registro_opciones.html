<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Registre - OVI')}"></head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container mt-5">
  <div class="text-center mb-4">
    <h2 style="font-weight: 800; letter-spacing: -0.03em;">Com vols registrar-te?</h2>
    <p class="text-muted">Selecciona el teu perfil per començar el procés de registre.</p>
  </div>
  <div class="row justify-content-center g-4">
    <div class="col-md-5">
      <div class="card h-100 border-primary" style="cursor: pointer;" onclick="window.location.href=this.querySelector('a').href">
        <div class="card-body text-center py-5">
          <i class="bi bi-person-wheelchair" style="font-size: 3rem; color: var(--ovi-primary);"></i>
          <h4 class="mt-3" style="font-weight: 700;">Nou Usuari OVI</h4>
          <p class="card-text">Necessite assistència personal per al meu dia a dia.</p>
          <a th:href="@{/registro/usuario}" class="btn btn-primary mt-2 px-4">Registre Usuari</a>
        </div>
      </div>
    </div>
    <div class="col-md-5">
      <div class="card h-100 border-success" style="cursor: pointer;" onclick="window.location.href=this.querySelector('a').href">
        <div class="card-body text-center py-5">
          <i class="bi bi-person-badge" style="font-size: 3rem; color: var(--ovi-success);"></i>
          <h4 class="mt-3" style="font-weight: 700;">Nou Assistent (PAP/PATI)</h4>
          <p class="card-text">Vull oferir els meus serveis d'assistència professional.</p>
          <a th:href="@{/registro/asistente}" class="btn btn-success mt-2 px-4">Registre Assistent</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
