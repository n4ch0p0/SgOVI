<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Supervisió de Contractes - OVI')}"></head>

<body class="bg-light">
    <nav th:replace="~{fragments/nav :: navbar}"></nav>
    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-file-earmark-check-fill"></i> Registre Global de Contractes</h2>
            <a th:href="@{/tecnic/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>

        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Client</th>
                            <th>Assistent</th>
                            <th>Data Inici</th>
                            <th>Contracte</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${contractes}">
                            <td th:text="${c.nomUsuari}"></td>
                            <td th:text="${c.nomAssistent}"></td>
                            <td th:text="${#temporals.format(c.dataInici, 'dd/MM/yyyy')}"></td>
                            <td>
                                <a th:href="@{/tecnic/todos-contractes/{id}/veure(id=${c.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-file-earmark-text me-1"></i>Veure
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(contractes)}">
                            <td colspan="4" class="text-center p-4 text-muted">No hi ha cap contracte formalitzat al sistema.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>

</html>
