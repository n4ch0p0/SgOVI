<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Negociacions en Curs - Tècnic')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2><i class="bi bi-chat-left-text-fill"></i> Negociacions en Curs</h2>
            <p class="text-muted mb-0">Sol·licituds aprovades on l'usuari està negociant amb assistents.</p>
        </div>
        <a th:href="@{/tecnic/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>
    </div>
    <hr>

    <div class="card shadow-sm mt-3">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Usuari</th>
                        <th>Tipus Servei</th>
                        <th>Preferències</th>
                        <th>Accions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="req : ${solicitudes}">
                        <td th:text="${req.id}"></td>
                        <td th:text="${mapaNomsUsuaris[req.dniUsuario]}"></td>
                        <td><span class="badge bg-primary" th:text="${req.tipusServei}"></span></td>
                        <td th:text="${req.preferencies}"></td>
                        <td>
                            <a th:href="@{/tecnic/negociacions/{id}(id=${req.id})}"
                               class="btn btn-sm btn-dark">
                                <i class="bi bi-chat-left-text"></i> Veure Converses
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(solicitudes)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            No hi ha sol·licituds aprovades amb negociacions actives.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
