<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Llistat Assistents - OVI')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<!-- Toast èxit -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100" th:if="${mensajeExito}">
    <div id="toastOk" class="toast align-items-center text-bg-success border-0"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensajeExito}"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tancar"></button>
        </div>
    </div>
</div>

<!-- Toast error -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100" th:if="${errorBaixa}">
    <div id="toastErr" class="toast align-items-center text-bg-danger border-0"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-x-circle-fill me-2"></i>
                <span th:text="${errorBaixa}"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tancar"></button>
        </div>
    </div>
</div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-person-badge"></i> Llistat Complet d'Assistents</h2>
        <a th:href="@{/tecnic/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>
    </div>

    <table class="table table-striped table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>DNI</th>
            <th>Nom i Cognoms</th>
            <th>Tipus</th>
            <th>Zona</th>
            <th>Estat</th>
            <th>Actiu</th>
            <th>Accions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${asistentes}">
            <td th:text="${a.dni}" class="fw-bold"></td>
            <td th:text="${a.nom} + ' ' + ${a.cognoms}"></td>
            <td><span class="badge bg-info text-dark" th:text="${a.tipus}"></span></td>
            <td th:text="${a.proximitatGeografica}"></td>
            <td>
                <span th:if="${a.estat == 'Acceptat'}" class="badge bg-success">Acceptat</span>
                <span th:if="${a.estat == 'Pendent'}" class="badge bg-warning text-dark">Pendent</span>
                <span th:if="${a.estat == 'Rebutjat'}" class="badge bg-danger">Rebutjat</span>
            </td>
            <td>
                <i th:if="${a.actiu}" class="bi bi-check-circle-fill text-success"></i>
                <i th:if="${!a.actiu}" class="bi bi-dash-circle text-muted"></i>
            </td>
            <td>
                <a th:unless="${a.estat == 'Rebutjat'}"
                   th:href="@{/tecnic/baixa-assistent/{dni}(dni=${a.dni})}"
                   class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-person-x-fill me-1"></i>Donar de Baixa
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<th:block th:if="${mensajeExito}">
<script>new bootstrap.Toast(document.getElementById('toastOk'), { delay: 5000 }).show();</script>
</th:block>
<th:block th:if="${errorBaixa}">
<script>new bootstrap.Toast(document.getElementById('toastErr'), { delay: 6000 }).show();</script>
</th:block>
</body>
</html>
