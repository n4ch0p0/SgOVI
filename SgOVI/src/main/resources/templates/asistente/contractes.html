<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Els meus Contractes - OVI')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-file-earmark-text me-2"></i>Els meus Contractes</h2>
            <p class="text-muted mb-0 small">Consulta els teus acords d'assistència personal.</p>
        </div>
        <a th:href="@{/asistente/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Client</th>
                    <th>Tipus de Servei</th>
                    <th>Data Inici</th>
                    <th>Data Fi</th>
                    <th>Estat</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="contracte : ${registreContracteUsuarioOvis}">
                    <td class="fw-bold" th:text="${contracte.nomUsuari}"></td>
                    <td th:text="${contracte.tipusServei}"></td>
                    <td th:text="${#temporals.format(contracte.fechaInici, 'dd/MM/yyyy')}"></td>
                    <td th:text="${contracte.fechaFin != null ? #temporals.format(contracte.fechaFin, 'dd/MM/yyyy') : 'Indefinit'}"></td>
                    <td><span class="badge bg-success">Formalitzat</span></td>
                </tr>
                <tr th:if="${#lists.isEmpty(registreContracteUsuarioOvis)}">
                    <td colspan="5" class="text-center py-5 text-muted">
                        <i class="bi bi-file-earmark-x" style="font-size: 2rem; display: block; margin-bottom: .5rem; opacity: .5;"></i>
                        Encara no tens cap contracte assignat.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
