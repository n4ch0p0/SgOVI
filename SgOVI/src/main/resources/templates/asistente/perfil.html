<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('El meu Perfil - OVI')}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<main class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h3 class="mb-0"><i class="bi bi-person-gear me-1"></i>El meu Perfil</h3>
                    <a th:href="@{/asistente/dashboard}" class="btn btn-light btn-sm"><i class="bi bi-arrow-left me-1"></i>Tornar al Menú</a>
                </div>
                <div class="card-body">

                    <form th:action="@{/asistente/perfil/actualizar}" th:object="${asistente}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">DNI</label>
                            <input type="text" class="form-control bg-light" th:field="*{dni}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipus d'Assistent</label>
                            <input type="text" class="form-control bg-light" th:field="*{tipus}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Formació Acadèmica <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" th:field="*{formacioAcademica}" rows="3"
                                      th:classappend="${#fields.hasErrors('formacioAcademica')} ? 'is-invalid'"
                                      required></textarea>
                            <div th:if="${#fields.hasErrors('formacioAcademica')}"
                                 th:errors="*{formacioAcademica}" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Experiència Prèvia <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" th:field="*{experienciaPrevia}" rows="3"
                                      th:classappend="${#fields.hasErrors('experienciaPrevia')} ? 'is-invalid'"
                                      required></textarea>
                            <div th:if="${#fields.hasErrors('experienciaPrevia')}"
                                 th:errors="*{experienciaPrevia}" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Proximitat Geogràfica (Localitat/Codi Postal) <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{proximitatGeografica}"
                                   th:classappend="${#fields.hasErrors('proximitatGeografica')} ? 'is-invalid'"
                                   required>
                            <div th:if="${#fields.hasErrors('proximitatGeografica')}"
                                 th:errors="*{proximitatGeografica}" class="invalid-feedback"></div>
                            <div class="form-text">Indica la teua localitat o codi postal per a la cerca de compatibilitat.</div>
                        </div>

                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-success px-5">
                                <i class="bi bi-save me-1"></i>Guardar Canvis
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<!-- Toast èxit al guardar -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1100" th:if="${mensajeExito}">
    <div id="toastPerfil" class="toast align-items-center text-bg-success border-0"
         role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${mensajeExito}"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Tancar"></button>
        </div>
    </div>
</div>

<th:block th:if="${mensajeExito}">
<script>new bootstrap.Toast(document.getElementById('toastPerfil'), { delay: 5000 }).show();</script>
</th:block>
</body>
</html>
